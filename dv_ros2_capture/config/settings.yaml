/**:
  ros__parameters:
    # The time between two timestamps
    timeIncrement: 1000
    # If true, sensor_msgs Image of the camera frames is published
    frames: false
    # If true, dv_ros EventArray containing the events batch is published
    events: true
    # If true, sensor_msgs Imu containing Imu data is published
    imu: true
    # If true, Trigger msg containing Trigger data is published
    triggers: false
    # Camera reference frame name for publishing IMU extrinsic calibration
    cameraFrameName: "camera"
    # IMU reference frame name for publishing IMU extrinsic calibration
    imuFrameName: "imu"
    # if true, the IMU accelerations and velocities are expressed in the camera frame
    transformImuToCameraFrame: true
    # If true, publish unbiased IMU data, that is IMU bias values that are read from
    # calibration file will be subtracted out of the raw IMU stream
    unbiasedImuData: true
    # Path to the camera calibration file
    cameraCalibrationFilePath: ""
    # Path to the aedat4 file, if not specified the first available camera will be read
    aedat4FilePath: ""
    # Camera to be read
    cameraName: ""
    # Enable noise filtering on the event stream
    noiseFiltering: false
    # Noise filter background activity time threshold in microseconds
    noiseBackgroundActivityTime: 2000
    # Wait for synchronization signal before publishing data
    waitForSync: false
    # Undistort events using the camera calibration parameters
    undistortEvents: false
    # DVXplorer / DVXplorerM IMU (BMI160) data rate. Live cameras only — ignored
    # when reading from an aedat4 file. The hardware delivers samples at this rate.
    # Accelerometer: 12.5Hz, 25Hz, 50Hz, 100Hz, 200Hz, 400Hz, 800Hz, 1600Hz
    imuAccelDataRate: "200Hz"
    # Gyroscope:     25Hz, 50Hz, 100Hz, 200Hz, 400Hz, 800Hz, 1600Hz, 3200Hz
    imuGyroDataRate:  "200Hz"
    # IMU oversampling filter. Reduces noise at the cost of latency:
    #   normal — no oversampling, lowest latency, highest noise
    #   osr2   — 2x oversampling then decimate (medium)
    #   osr4   — 4x oversampling then decimate (lowest noise, highest latency)
    imuAccelFilter: "normal"
    imuGyroFilter:  "normal"
    # Static IMU biases [x, y, z]. When non-empty (length 3), these override
    # any bias values loaded from the camera calibration file. Subtracted from
    # raw IMU samples when unbiasedImuData is true. Leave empty ([]) to fall
    # back to the calibration file. Copy-paste from a bias.json calibration:
    #   accelerometer_bias_refined_m_s2 -> accelerometerBias
    #   gyroscope_bias_rad_s            -> gyroscopeBias
    accelerometerBias: [0.822333771293767, -0.4204056391087951, 0.13869418012856144]
    gyroscopeBias:     [-0.008375375021517997, -0.0031113306658109284, -0.0039612173365261875]
