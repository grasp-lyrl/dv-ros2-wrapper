# The bags record avoid_ros_namespace_conventions: true, which hides replayed topics from
# ordinary subscribers. Overriding the QoS drops it.
/neurofly1/events:
  history: keep_last
  depth: 1000
  reliability: reliable
  durability: volatile
/neurofly1/imu:
  history: keep_last
  depth: 1000
  reliability: reliable
  durability: volatile
/neurofly1/mavros/distance_sensor:
  history: keep_last
  depth: 10
  reliability: reliable
  durability: volatile
